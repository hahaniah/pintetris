<!DOCTYPE <html>
    <html lang= "en">
        <head>
            <meta charset ="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>pintetris</title>
            <style>
                * {margin: 0; padding: 0; box-sizing: border-box;}

                body {
                    background: url(bgg.png) center center / cover no-repeat;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    height: 100vh;
                    font-family: monospace;
                    color: #fff;
                }
                .game-wrap {
                    display: flex;
                    gap:2rem;
                    align-items: flex-start;
                    padding-top: 2rem;

                }
                canvas {
                    border: 4px solid #d0c0fd;
                    display: block;
                }
                .sidebar {
                    display:flex;
                    flex-direction: column;
                    gap: 1.5rem;
                    min-width: 120px;
                }
                .sidebar h1 {
                    font-size: 1.4rem;
                    letter-spacing: 0.1rem;
                    color: #9b5de5;
                    
                }
                .label {
                    font-size: 0.7rem;
                    text-transform: uppercase;
                    letter-spacing: 0.15rem;
                    color: #9b5de5;
                    margin-bottom: 0.3rem;
                }
                .score-val {
                    font-size: 1.6rem;
                    color: #9b5de5;
                }
                #next-canvas {
                    border: 1px solid #333;
                }
                .btn {
                    background: #9b5de5;
                    color: #fff;
                    border: none;
                    padding: 0.6rem 1rem;
                    font-family: monospace;
                    font-size: 0.85rem;
                    cursor: pointer;
                    border-radius: 4px;
                    font-weight: bold;
                    letter-spacing: 0.05rem;
                }

                .btn:hover {opacity: 0.85;}

                #game-over {
                    display: none;
                    position: fixed;
                    inset: 0;
                    background: rgba(0,0,0,0.75);
                    align-items: center;
                    justify-content: center;
                    flex-direction: column;
                    gap: 1rem;
                    font-size: 1.2rem;
                }
                .title-img {
                    position: fixed;
                    bottom:150px;
                    left: 10px;
                    width: 400px;
                    pointer-events: none;
                    z-index: 2;
                }

                .char-img {
                    position: fixed;
                    bottom:0;
                    left: 0;
                    width: 700px;
                    pointer-events: none;
                    z-index: 0;
                }
                .deco {
                    position: fixed;
                    pointer-events: none;
                    z-index: 0;
                    width: 110px;
                }
                .block-blue { top: 8%; right: 8%; --tilt: -6deg; width: 170; }
                .block-lilac { top: 68%; right: 14%; --tilt: 50deg; width: 150;}
                .block-pink { top: -2%; left: 0%; --tilt: -6deg; width: 150;}
                .girl { top: 60%; left: 20%; width: 180;}
                .game-wrap {
                    position: relative;
                    z-index: 1;
                }
                #game-over.show {display: flex;}
                #game-over h2 {color: #e0aaff; font-size: 2rem;}

                .float {
                    animation: bob 4s ease-in-out infinite;
                }
                .block-lilac.float { animation-duration: 5s; }
                .block-pink.float { animation-duration: 3.5s;}

                @keyframes bob {
                0%, 100% { transform: rotate(var(var--tilt, 0deg)) translateY(0);}
                50%  { transform: rotate(var(--tilt, 0deg)) translateY(-10px);}
                }
            </style>
        </head>
        <body>
        <img class="char-img" src="char.png" alt="character" />
        <img class="deco block-blue float" src="blue.png" alt="" />
        <img class="deco block-lilac float" src="lilac.png" alt=""/>
        <img class="deco block-pink float" src="pink.png" alt=""/>
        <img class="deco girl" src="girl.png" alt=""/>

        <div class="game-wrap">
            <div class="game-left">
                <img class="title-img" src="title.png" alt="tetris" />
                <canvas id="board" width="240" height="480"></canvas>
                </div>

                <div class="sidebar">
                    <h1>pintetris</h1>
                
                <div>
                    <p class="label">score</p>
                 <p class="score-val" id="score">0</p>
                </div>

                <div>
                    <p class="label">level</p>
                     <p class="score-val" id="level">1</p>
                    </div>

                    <div>
                       <p class="label">next</p>
                       <canvas id="next-canvas" width="100" height="100"></canvas>
                    </div>
                    
        
                    <button class="btn" id="start-btn">start</button>
                    <button class="btn" id="pause-btn">pause</button>
                    </div>
                    </div>

                    <div id="game-over">
                        <h2>game over</h2>
                        <p id="final-score"></p>
                        <button class="btn" onclick="restartGame()">play again</button>
                        </div>

                        <audio id="bg-music" src="bgmusic.mp3" loop></audio>
                         <script src="tetris.js"></script>
                    </body>                  
</html>
